server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3JfaHMyNTZfamF2YV9zcHJpbmdfYm9vdF9kczAzX3JpZGVfaGFpbGluZw==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# driver-service internal API, called by POST /api/auth/register/driver.
# internal-api-key must equal driver-service's internal.api-key (both read INTERNAL_API_KEY).
driver-service:
  url: ${DRIVER_SERVICE_URL:http://localhost:8082}
  connect-timeout: 1s
  read-timeout: 2s
  internal-api-key: ${INTERNAL_API_KEY:local-dev-internal-api-key}

# Fake DRIVER/PASSENGER accounts for local runs and demos (tests/data/identity/README.md).
# Set SEED_DATA_ENABLED=false for any environment that is not a local/demo one.
app:
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
    password: ${SEED_USER_PASSWORD:Demo@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{correlationId}] %m%n%wEx"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

