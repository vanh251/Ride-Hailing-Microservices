spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  # No broker in the test suite: the listener is not started unless a test turns it on
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: driver-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      auto-startup: false

internal:
  api-key: test-internal-api-key

# Test-only key (Base64, 408 bits), never used outside the test suite
jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1pZGVudGl0eS1zZXJ2aWNlLXRlc3Rz

app:
  seed:
    enabled: false

# The repositories are mocks in most tests, so the lease expiry job and the outbox relay stay off
driver:
  reservation:
    lease-seconds: 30
    expiry-check-enabled: false
  outbox:
    enabled: false
