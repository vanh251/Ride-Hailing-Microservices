server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: driver-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/driver_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail fast when driver_db is down so a Kafka retry follows the 1s/2s/4s backoff of docs/events.md §8
      # instead of waiting 30s per attempt
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  # Consumes trip-events: DriverAssigned, TripCompleted, TripCancelled (docs/events.md §5).
  # The producer publishes the outbox to driver-events and moves failed records to trip-events.DLQ.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: driver-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate

# Verifies tokens issued by identity-service: must be the same JWT_SECRET (Base64) as identity-service
jwt:
  secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3JfaHMyNTZfamF2YV9zcHJpbmdfYm9vdF9kczAzX3JpZGVfaGFpbGluZw==}

# Shared secret for service-to-service calls on /internal/** (identity-service -> driver-service).
# Must be the same value in both services; override with INTERNAL_API_KEY outside local runs.
internal:
  api-key: ${INTERNAL_API_KEY:local-dev-internal-api-key}

# Fake driver profiles for identity-service's demo DRIVER accounts (tests/data/driver/README.md).
# Set SEED_DATA_ENABLED=false for any environment that is not a local/demo one.
app:
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

# Reservation lease (POST /api/drivers/{id}/reserve): a RESERVED driver that is not assigned within lease-seconds
# returns to AVAILABLE; expiry-check-ms is how often expired leases are looked for.
driver:
  reservation:
    lease-seconds: ${DRIVER_RESERVATION_LEASE_SECONDS:30}
    expiry-check-ms: ${DRIVER_RESERVATION_EXPIRY_CHECK_MS:5000}
    expiry-check-enabled: true
  # Outbox of driver_db: DriverAssignmentConfirmed / DriverAssignmentRejected are sent to driver-events every
  # poll-interval-ms; a send that the broker does not acknowledge within ack-timeout-ms is retried on the next run.
  outbox:
    enabled: ${DRIVER_OUTBOX_ENABLED:true}
    poll-interval-ms: ${DRIVER_OUTBOX_POLL_INTERVAL_MS:1000}
    ack-timeout-ms: ${DRIVER_OUTBOX_ACK_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{correlationId}] %m%n%wEx"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

