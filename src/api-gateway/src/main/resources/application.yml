server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: driver-service
              uri: ${DRIVER_SERVICE_URL:http://driver-service:8082}
              predicates:
                - Path=/api/drivers/*,/api/drivers/*/status,/api/drivers/*/location

            - id: trip-service
              uri: ${TRIP_SERVICE_URL:http://trip-service:8083}
              predicates:
                - Path=/api/trips/**

            # Internal-only endpoints (rematch, pricing /final, payment /charge and /refund) are not routed:
            # services call them directly over Docker DNS (docs/api.md §10)
            - id: matching-service
              uri: ${MATCHING_SERVICE_URL:http://matching-service:8084}
              predicates:
                - Path=/api/matching/*/match

            - id: pricing-service
              uri: ${PRICING_SERVICE_URL:http://pricing-service:8085}
              predicates:
                - Path=/api/pricing/quote

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8086}
              predicates:
                - Path=/api/payments/*,/api/payments/*/checkout,/api/payments/webhooks/payos

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}
              predicates:
                - Path=/api/notifications/**

# Verifies tokens issued by identity-service: must be the same JWT_SECRET (Base64) as identity-service
jwt:
  secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3JfaHMyNTZfamF2YV9zcHJpbmdfYm9vdF9kczAzX3JpZGVfaGFpbGluZw==}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{correlationId}] %m%n%wEx"
